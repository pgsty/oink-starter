sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: Open-source project starter
  title_lines:
    - words: [{ text: Your project. }]
    - words: [{ text: Clearly documented. }]
  lead: A ready-to-edit home for documentation, project updates, and long-form guides.
  actions:
    - { label: Read the docs, url: docs/, icon: fa-solid fa-book, style: primary }
    - { label: Follow the tutorial, url: book/, icon: fa-solid fa-arrow-right, style: ghost }

cards:
  eyebrow: Start with structure
  title: Everything has a place
  columns: 3
  items:
    - title: Blog
      desc: Publish posts, design notes, and release announcements.
      icon: fa-solid fa-pen-nib
      url: blog/
    - title: Docs
      desc: Organize reference material as Introduction, Get Started, Tutorial, and Reference.
      icon: fa-solid fa-book-open
      url: docs/
    - title: Book
      desc: Teach a complete workflow in a focused, sequential reading experience.
      icon: fa-solid fa-graduation-cap
      url: book/

cta:
  title: Make this starter yours.
  text: Change the project name and URL, replace the sample copy, and publish.
  label: Get started
  url: docs/get-started/
  style: primary
