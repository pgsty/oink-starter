sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: Modèle pour projet open source
  title_lines:
    - words: [{ text: Votre projet. }]
    - words: [{ text: Clairement documenté. }]
  lead: Un site prêt à adapter pour la documentation, les actualités et les guides détaillés.
  actions:
    - { label: Lire la documentation, url: docs/, icon: fa-solid fa-book, style: primary }
    - { label: Suivre le tutoriel, url: book/, icon: fa-solid fa-arrow-right, style: ghost }

cards:
  eyebrow: Commencez par la structure
  title: Chaque contenu a sa place
  columns: 3
  items:
    - title: Blog
      desc: Publiez des articles, des notes de conception et des annonces de version.
      icon: fa-solid fa-pen-nib
      url: blog/
    - title: Documentation
      desc: Organisez les ressources en Introduction, Premiers pas, Tutoriel et Référence.
      icon: fa-solid fa-book-open
      url: docs/
    - title: Livre
      desc: Enseignez un flux de travail complet dans une lecture continue.
      icon: fa-solid fa-graduation-cap
      url: book/

cta:
  title: Faites de ce modèle votre site.
  text: Modifiez le nom et l’URL du projet, remplacez les exemples, puis publiez.
  label: Commencer
  url: docs/get-started/
  style: primary
