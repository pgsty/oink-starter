sections: [hero, cards, cta]

hero:
  align: center
  eyebrow: 开源项目起步模板
  title_lines:
    - words: [{ text: 你的项目， }]
    - words: [{ text: 清楚讲明白。 }]
  lead: 一个可以直接修改的项目首页，容纳文档、动态与长篇指南。
  actions:
    - { label: 阅读文档, url: docs/, icon: fa-solid fa-book, style: primary }
    - { label: 跟随教程, url: book/, icon: fa-solid fa-arrow-right, style: ghost }

cards:
  eyebrow: 从清晰结构开始
  title: 每类内容都有自己的位置
  columns: 3
  items:
    - title: 博客
      desc: 发布文章、设计记录与版本公告。
      icon: fa-solid fa-pen-nib
      url: blog/
    - title: 文档
      desc: 按简介、快速上手、教程与参考组织资料。
      icon: fa-solid fa-book-open
      url: docs/
    - title: 书籍
      desc: 用连续的阅读体验讲清一套完整工作流。
      icon: fa-solid fa-graduation-cap
      url: book/

cta:
  title: 把这个模板变成你的站点。
  text: 修改项目名称与网址，替换示例文案，然后发布。
  label: 开始使用
  url: docs/get-started/
  style: primary
