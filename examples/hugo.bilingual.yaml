# Minimal English + Chinese profile. Copy this file to ../hugo.yaml to use it.
title: &siteTitle Project Name
baseURL: https://example.org/
defaultContentLanguage: en
disableLanguages: [fr]
enableGitInfo: true
enableRobotsTXT: true

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: *siteTitle
    params:
      description: Documentation, updates, and guides for your project.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: 你的项目文档、动态与指南。
  # Keep French declared so Hugo recognizes .fr.md as a disabled translation.
  fr:
    label: Français
    locale: fr-FR
    weight: 3
    title: *siteTitle

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: Project contributors
    from_year: 2026
  footer_center_info: ''
  ui:
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
